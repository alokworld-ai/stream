<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STREAM AI by Alok Tripathi</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#ffffff;--ink:#0b1b3a;--mute:#5a6b8c;--blue:#1f5eff;--sky:#7fb0ff;--line:#dbe6fb;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6}
h1,h2,h3,.logo{font-family:Sora,Inter,system-ui,sans-serif;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
header{padding:26px 0}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:.04em}
.logo b{color:var(--blue)}
.logo small{font-weight:400;color:var(--mute);letter-spacing:0;margin-left:6px;font-size:.85rem}
.hero{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 24px 60px -36px rgba(31,94,255,.35);border-radius:28px;padding:64px 40px;margin-bottom:56px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.08;font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--mute);max-width:46ch;margin:18px 0 28px}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;background:var(--blue);color:#fff;font:600 1rem Sora,sans-serif;padding:14px 26px;border-radius:999px;box-shadow:0 10px 30px -10px var(--blue)}
.btn:focus-visible,.card:focus-visible,.x:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.feat{position:relative;aspect-ratio:16/10;border-radius:20px;background:linear-gradient(135deg,var(--blue),#0a2a7a);overflow:hidden;cursor:pointer;border:0;padding:0;box-shadow:0 30px 60px -30px var(--blue)}
.feat img,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;z-index:2}
.play::after{content:"";border-left:20px solid var(--blue);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
section{margin-bottom:56px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px;flex-wrap:wrap}
.sh h2{font-size:1.5rem;font-weight:600}
.sh span{color:var(--mute);font-size:.92rem}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--blue)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--blue),var(--sky))}
.thumb .play{width:46px;height:46px}.thumb .play::after{border-left-width:14px;border-top-width:8px;border-bottom-width:8px;margin-left:4px}
.meta{padding:14px 16px 18px}
.meta h3{font-size:1rem;font-weight:600;line-height:1.35}
.meta p{margin:6px 0 0;color:var(--mute);font-size:.88rem}
footer{border-top:1px solid var(--line);padding:30px 0 40px;text-align:center;color:var(--mute);font-size:.9rem}
#modal{position:fixed;inset:0;background:rgba(255,255,255,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal.on{display:flex}
.box{width:min(960px,100%);background:var(--card);border-radius:18px;overflow:hidden}
.frame{aspect-ratio:16/9;background:#000}
.frame iframe{width:100%;height:100%;border:0;display:block}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap}
.bar a{color:var(--blue);font-weight:500}
.x{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;font:inherit}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:40px 24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">STREAM <b>AI</b><small>by Alok Tripathi</small></div></header>

<div class="hero">
  <div>
    <h1>Watch how machines learn to think.</h1>
    <p>A hand-picked screening room for AI explainers, build-alongs and long conversations. Pick a video and it plays right here.</p>
    <button class="btn" id="heroPlay">Play featured</button>
  </div>
  <button class="feat" id="feat" aria-label="Play featured video"><div class="play"></div></button>
</div>

<main id="main"></main>
<footer>STREAM AI by Alok Tripathi. Videos belong to their creators and stream from YouTube.</footer>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-label="Video player">
  <div class="box">
    <div class="frame" id="frame"></div>
    <div class="bar"><a id="yt" target="_blank" rel="noopener">Open on YouTube</a><button class="x" id="close">Close</button></div>
  </div>
</div>

<script>
const DATA=[
 {t:"Start here",d:"The ideas behind modern AI, explained visually.",v:[
  ["aircAruvnKk","But what is a neural network?","3Blue1Brown"],
  ["IHZwWFHWa-w","Gradient descent, how neural networks learn","3Blue1Brown"],
  ["wjZofJX0v4M","Transformers, the tech behind LLMs","3Blue1Brown"],
  ["CqOfi41LfDw","Neural Networks, clearly explained","StatQuest"]]},
 {t:"Build with code",d:"Write the models yourself, line by line.",v:[
  ["VMj-3S1tku0","Building micrograd from scratch","Andrej Karpathy"],
  ["kCc8FmEb1nY","Let's build GPT from scratch","Andrej Karpathy"],
  ["zduSFxRajkE","Let's build the GPT tokenizer","Andrej Karpathy"],
  ["l8pRSuU81PU","Let's reproduce GPT-2 (124M)","Andrej Karpathy"]]},
 {t:"Deep dives and talks",d:"Longer watches for when you want the full picture.",v:[
  ["zjkBMFhNj_g","Intro to Large Language Models","Andrej Karpathy"],
  ["7xTGNNLPyMI","Deep Dive into LLMs like ChatGPT","Andrej Karpathy"],
  ["L_Guz73e6fw","Sam Altman on GPT-4 and the future of AI","Lex Fridman"],
  ["ugvHCXCOmm4","Dario Amodei on Claude and AI scaling","Lex Fridman"]]}
];
const FEATURED="zjkBMFhNj_g";
const th=id=>`<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">`;
const main=document.getElementById('main');
DATA.forEach(s=>{
  const sec=document.createElement('section');
  sec.innerHTML=`<div class="sh"><h2>${s.t}</h2><span>${s.d}</span></div><div class="row">`+
   s.v.map(([id,t,c])=>`<button class="card" data-id="${id}"><div class="thumb">${th(id)}<div class="play"></div></div><div class="meta"><h3>${t}</h3><p>${c}</p></div></button>`).join('')+`</div>`;
  main.appendChild(sec);
});
document.getElementById('feat').insertAdjacentHTML('afterbegin',th(FEATURED));
const modal=document.getElementById('modal'),frame=document.getElementById('frame');
function open_(id){
  frame.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video"></iframe>`;
  document.getElementById('yt').href="https://www.youtube.com/watch?v="+id;
  modal.classList.add('on');
}
function close_(){modal.classList.remove('on');frame.innerHTML=''}
main.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)open_(c.dataset.id)});
document.getElementById('feat').onclick=document.getElementById('heroPlay').onclick=()=>open_(FEATURED);
document.getElementById('close').onclick=close_;
modal.addEventListener('click',e=>{if(e.target===modal)close_()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close_()});
</script>
</body>
</html>
